<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10262B">
  <meta name="description" content="烤火候大师：45秒夜市火候挑战，按住加火，把火候停在刚刚好，生成一张可以晒的战绩收据。">
  <title>烤火候大师｜45秒夜市火候挑战</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="lantern-line" aria-hidden="true"></div>
  <main class="stall-shell">
    <header class="stall-head">
      <div class="brand-mark">
        <p class="brand-kicker">今日营业</p>
        <h1>烤火候大师</h1>
      </div>
      <button id="soundToggle" class="icon-button" type="button" aria-label="关闭音效" aria-pressed="true">声音开</button>
    </header>

    <section class="ticket-strip" aria-label="今日挑战信息">
      <div>
        <span>今日口令</span>
        <strong id="dailyCode">载入中</strong>
      </div>
      <div>
        <span>个人最佳</span>
        <strong id="bestScore">0</strong>
      </div>
      <div>
        <span>连续打卡</span>
        <strong id="streakDays">0天</strong>
      </div>
    </section>

    <section id="welcomeScreen" class="stage welcome-screen" aria-labelledby="welcomeTitle">
      <div class="welcome-copy">
        <p class="hand-note">一秒上手</p>
        <h2 id="welcomeTitle">45秒，<br>把火候停在刚好</h2>
        <p>顾客会点「三分 / 五分 / 七分」。按住加火，扇风降温，在颜色进入好味区时出餐。</p>
      </div>
      <div class="grill-preview" aria-hidden="true">
        <div class="preview-smoke"><span></span><span></span><span></span></div>
        <div class="preview-skewer"><i></i><i></i><i></i><i></i></div>
        <div class="preview-coals"><b></b><b></b><b></b><b></b></div>
      </div>
      <div class="welcome-actions">
        <button id="startButton" class="primary-button" type="button">开始营业</button>
        <p>不用登录，不上传照片</p>
      </div>
    </section>

    <section id="gameScreen" class="stage game-screen is-hidden" aria-labelledby="gameTitle" hidden>
      <div class="game-top">
        <div class="time-block">
          <span>营业倒计时</span>
          <strong><span id="timeLeft">45.0</span><small>秒</small></strong>
        </div>
        <div class="score-block">
          <span>今日营收</span>
          <strong id="score">0</strong>
        </div>
      </div>

      <div class="order-card" aria-live="polite">
        <div>
          <span id="orderIndex">第 1 串</span>
          <h2 id="orderTitle">顾客要五分熟</h2>
        </div>
        <div class="order-target">
          <span>目标火候</span>
          <strong id="orderRange">45–55</strong>
        </div>
      </div>

      <div class="heat-panel">
        <div class="heat-label-row">
          <span>火候轨道</span>
          <span id="comboText">连击 0</span>
        </div>
        <div id="heatTrack" class="heat-track" role="meter" aria-label="当前火候" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25">
          <div id="targetBand" class="target-band"></div>
          <div id="heatFill" class="heat-fill"></div>
          <div id="heatNeedle" class="heat-needle"><span></span></div>
        </div>
        <div class="heat-legend" aria-hidden="true"><span>生</span><span>刚好</span><span>焦</span></div>
      </div>

      <div class="grill-stage" id="grillStage" aria-hidden="true">
        <div class="smoke-layer"><i></i><i></i><i></i></div>
        <div class="grill-rack"></div>
        <div id="skewer" class="skewer"><b></b><b></b><b></b><b></b><b></b></div>
        <div class="coal-row"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="game-controls">
        <button id="heatButton" class="control-button heat-button" type="button">按住加火</button>
        <button id="fanButton" class="control-button fan-button" type="button">扇风降温</button>
        <button id="serveButton" class="control-button serve-button" type="button">出餐</button>
      </div>
      <p id="gameHint" class="game-hint">先按住加火，火候会持续上升。</p>
    </section>

    <section id="resultScreen" class="stage result-screen is-hidden" aria-labelledby="resultTitle" hidden>
      <div class="result-head">
        <p class="hand-note">营业结束</p>
        <h2 id="resultTitle">今日火候成绩单</h2>
      </div>
      <div class="receipt-wrap">
        <canvas id="receiptCanvas" width="720" height="1080" role="img" aria-label="本局战绩收据图片">你的浏览器不支持战绩图。</canvas>
        <div id="resultStamp" class="result-stamp" aria-hidden="true">新纪录</div>
      </div>
      <p id="resultSummary" class="result-summary">正在生成战绩…</p>
      <div class="result-actions">
        <button id="downloadButton" class="primary-button" type="button">保存战绩图</button>
        <button id="copyButton" class="secondary-button" type="button">复制挑战文案</button>
        <button id="shareButton" class="secondary-button is-hidden" type="button" hidden>系统分享</button>
        <button id="restartButton" class="secondary-button" type="button">再烤一局</button>
      </div>
      <p id="copyStatus" class="copy-status" role="status"></p>
    </section>

    <footer class="stall-foot">
      <span>原创轻工具 · 娱乐计分</span>
      <a href="privacy.html">隐私说明</a>
    </footer>
  </main>
  <div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
